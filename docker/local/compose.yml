# Default: 2 services — database + application (same split as production: data vs app).
# Optional mail + Redis: docker compose -f docker/local/compose.yml -f docker/local/compose.devtools.yml --profile devtools up -d --build
# Or: pnpm run docker:local:up:devtools
name: esign-local

services:
  database:
    image: postgres:15
    container_name: esign-local-database
    volumes:
      - esign_local_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U documenso']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: password
      POSTGRES_DB: documenso
    ports:
      - '54320:5432'

  application:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: esign-local-application
    depends_on:
      database:
        condition: service_healthy
      inbucket:
        condition: service_started
        required: false
      redis:
        condition: service_started
        required: false
    env_file:
      - ../../.env
    environment:
      NEXT_PRIVATE_DATABASE_URL: postgres://documenso:password@database:5432/documenso
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgres://documenso:password@database:5432/documenso
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://application:3000
      NEXT_PUBLIC_WEBAPP_URL: http://localhost:3000
      PORT: '3000'
      # No Redis in the default 2-service stack; matches .env.example "local" jobs.
      NEXT_PRIVATE_JOBS_PROVIDER: local
      NEXT_PRIVATE_REDIS_URL: ''
    ports:
      - '3000:3000'
    volumes:
      - ../../apps/remix/example/cert.p12:/opt/documenso/cert.p12:ro

  inbucket:
    profiles: [devtools]
    image: inbucket/inbucket
    container_name: esign-local-mail
    ports:
      - '9000:9000'
      - '2500:2500'
      - '1100:1100'

  redis:
    profiles: [devtools]
    image: redis:8-alpine
    container_name: esign-local-redis
    ports:
      - '63790:6379'
    volumes:
      - esign_local_redis:/data

volumes:
  esign_local_pg:
  esign_local_redis:
