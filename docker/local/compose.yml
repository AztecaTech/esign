# Local full stack: Postgres, Inbucket (mail UI), Redis, and the Remix app built from this repo.
# Usage: see docker/local/README.md
name: esign-local

services:
  database:
    image: postgres:15
    container_name: esign-local-db
    volumes:
      - esign_local_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U documenso']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: password
      POSTGRES_DB: documenso
    ports:
      - '54320:5432'

  inbucket:
    image: inbucket/inbucket
    container_name: esign-local-mail
    ports:
      - '9000:9000'
      - '2500:2500'
      - '1100:1100'

  redis:
    image: redis:8-alpine
    container_name: esign-local-redis
    ports:
      - '63790:6379'
    volumes:
      - esign_local_redis:/data

  web:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: esign-local-app
    depends_on:
      database:
        condition: service_healthy
      inbucket:
        condition: service_started
      redis:
        condition: service_started
    env_file:
      - ../../.env
    environment:
      # Override host-only defaults from .env for in-network service names
      NEXT_PRIVATE_DATABASE_URL: postgres://documenso:password@database:5432/documenso
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgres://documenso:password@database:5432/documenso
      NEXT_PRIVATE_SMTP_HOST: inbucket
      NEXT_PRIVATE_SMTP_PORT: '2500'
      NEXT_PRIVATE_REDIS_URL: redis://redis:6379
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://web:3000
      NEXT_PUBLIC_WEBAPP_URL: http://localhost:3000
      PORT: '3000'
    ports:
      - '3000:3000'
    volumes:
      - ../../apps/remix/example/cert.p12:/opt/documenso/cert.p12:ro

volumes:
  esign_local_pg:
  esign_local_redis:
