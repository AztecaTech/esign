name: 'Setup node, npm, and cache'
inputs:
  node_version:
    required: false
    default: '22.x'

runs:
  using: 'composite'
  steps:
    - name: Set up Node ${{ inputs.node_version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}
        cache: 'npm'

    - name: Install dependencies
      shell: bash
      run: |
        npm ci
        npm run prisma:generate
      env:
        HUSKY: '0'
